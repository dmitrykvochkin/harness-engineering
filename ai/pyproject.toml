[project]
name = "harness-ai"
version = "0.1.0"
description = "AI agents and data pipeline for agent failure detection (Pydantic AI)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=2.48.0",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
]

[project.scripts]
harness-upload = "harness_ai.db.upload:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Authored dialogue and rationale prose; rewrapping it hurts readability.
"src/harness_ai/dataset/scenarios_*.py" = ["E501"]
